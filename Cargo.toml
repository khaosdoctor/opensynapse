[package]
name = "opensynapse"
version = "0.2.5"
edition = "2024"
description = "Remap buttons, set DPI and lighting on Razer mice from Linux"
license = "GPL-2.0-or-later"

[[bin]]
name = "opensynapse-gui"
required-features = ["gui"]

[dependencies]
eframe = { version = "0.37.0", optional = true }
libc = "0.2.191"
rfd = { version = "0.18.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[features]
gui = ["dep:eframe", "dep:rfd"]
