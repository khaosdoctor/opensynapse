# Transaction id and USB interface for Razer mice, used by `opensynapse init`
# to start a device file for a mouse that doesn't have one yet. Only the
# transport, not the buttons: those come from asking the mouse.
#
# Taken from OpenRGB (GPL-2.0-or-later), Controllers/RazerController/
# RazerDevices.cpp and RazerControllerDetect.cpp at commit 029758e
# (2026-11-07): https://gitlab.com/CalcProgrammer1/OpenRGB
# Entries without an interface weren't in OpenRGB's detect list, 0 is tried.
# Bluetooth-only ids are left out since opensynapse talks over USB.
#
# OpenRazer disagrees on 0x0084 (DeathAdder V2): it uses 0x3f there.
# `opensynapse init` tries the listed id first and falls back to the others.

