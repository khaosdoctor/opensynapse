name: aur

on:
  push:
    tags:
      - "v*"
  # republish an existing tag, using the PKGBUILDs and workflow from main
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to publish, like v0.1.1"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Builds the binaries for opensynapse-bin on Arch, so they link against the
  # same libraries users have, and attaches them to the GitHub release.
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # A tag that doesn't match Cargo.toml would publish a package whose
      # binary reports a different version, so stop before touching the AUR.
      - name: check tag matches Cargo.toml
        run: |
          tag="${TAG#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: build
        run: |
          pacman -Syu --noconfirm --needed rust libxkbcommon wayland libglvnd github-cli
          cargo build --locked --release --features gui

      - name: attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="opensynapse-${TAG#v}"
          mkdir -p "$d/devices"
          cp target/release/opensynapse target/release/opensynapse-gui README.md PROTOCOL.md LICENSE "$d/"
          cp -r udev assets "$d/"
          cp -r devices/protocols "$d/devices/"
          tar czf "$d-x86_64.tar.gz" "$d"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$TAG" "$d-x86_64.tar.gz" -R "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      # one package failing (say, nothing changed on a re-run) shouldn't cancel the others
      fail-fast: false
      matrix:
        include:
          - pkg: opensynapse
            sums: true
          - pkg: opensynapse-bin
            sums: true
          # builds from git, so there is nothing to checksum
          - pkg: opensynapse-git
            sums: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/" contrib/aur/${{ matrix.pkg }}/PKGBUILD

      # Job-level `if:` can't read the secrets context, so check for AUR_KEY
      # here and skip the deploy step until the secret exists.
      - id: check-secret
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      # Regenerates sha256sums (updpkgsums) and .SRCINFO in its own container.
      - if: steps.check-secret.outputs.has_key == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: ./contrib/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: ${{ matrix.sums }}
          commit_username: Lucas Santos
          commit_email: hello@lsantos.dev
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "Update to ${{ env.TAG }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
