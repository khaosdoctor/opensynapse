name: release

on:
  push:
    tags:
      - "v*"
  # republish an existing tag, using the PKGBUILDs and workflow from main
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to publish, like v0.1.1"
        required: true
      publish_only:
        description: "skip the build and publish the release files that are already there"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Builds a tar.gz, .deb and AppImage per architecture and attaches them to
  # the GitHub release. Ubuntu 22.04 has an old glibc, so the binaries also
  # run on older distros; they only link glibc and libgcc, the GUI loads
  # wayland, X11 and GL at runtime.
  build:
    if: ${{ !inputs.publish_only }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb: amd64
            appimagetool: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - runner: ubuntu-22.04-arm
            arch: aarch64
            deb: arm64
            appimagetool: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # A tag that doesn't match Cargo.toml would publish a package whose
      # binary reports a different version, so stop before releasing anything.
      - name: check tag matches Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${TAG#v}" != "$crate" ]; then
            echo "tag $TAG does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: build
        run: |
          command -v cargo || curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --locked --release --features gui

      - name: tar.gz
        run: |
          d="opensynapse-${TAG#v}"
          mkdir -p "$d/devices"
          cp target/release/opensynapse target/release/opensynapse-gui README.md PROTOCOL.md LICENSE "$d/"
          cp -r udev assets contrib/completions "$d/"
          cp -r devices/protocols "$d/devices/"
          tar czf "$d-${{ matrix.arch }}.tar.gz" "$d"

      - name: deb
        run: |
          r=deb
          install -Dm755 -t "$r/usr/bin" target/release/opensynapse target/release/opensynapse-gui
          install -Dm644 udev/70-opensynapse.rules "$r/usr/lib/udev/rules.d/70-opensynapse.rules"
          install -Dm644 assets/opensynapse.desktop "$r/usr/share/applications/opensynapse.desktop"
          install -Dm644 assets/icon.svg "$r/usr/share/icons/hicolor/scalable/apps/opensynapse.svg"
          install -Dm644 assets/icon.png "$r/usr/share/icons/hicolor/256x256/apps/opensynapse.png"
          install -Dm644 -t "$r/usr/share/doc/opensynapse" README.md PROTOCOL.md LICENSE
          install -Dm644 contrib/completions/opensynapse.bash "$r/usr/share/bash-completion/completions/opensynapse"
          install -Dm644 contrib/completions/_opensynapse "$r/usr/share/zsh/vendor-completions/_opensynapse"
          install -Dm644 contrib/completions/opensynapse.fish "$r/usr/share/fish/vendor_completions.d/opensynapse.fish"
          install -Dm644 -t "$r/usr/share/doc/opensynapse/protocols" devices/protocols/*.md
          mkdir -p "$r/DEBIAN"
          printf '%s\n' \
            "Package: opensynapse" \
            "Version: ${TAG#v}" \
            "Architecture: ${{ matrix.deb }}" \
            "Maintainer: Lucas Santos <hello@lsantos.dev>" \
            "Depends: libc6 (>= 2.35), libgcc-s1" \
            "Recommends: libxkbcommon0, libwayland-client0, libegl1, xdg-desktop-portal" \
            "Suggests: openrazer-driver-dkms" \
            "Section: utils" \
            "Priority: optional" \
            "Homepage: https://github.com/khaosdoctor/opensynapse" \
            "Description: Remap buttons, set DPI and lighting on Razer mice from Linux" \
            > "$r/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$r" "opensynapse_${TAG#v}_${{ matrix.deb }}.deb"

      # The AppImage runs the GUI. The udev rule can't come with it, so users
      # install that by hand like a cargo install. winit loads xkbcommon at runtime
      # and not every distro has it, so we bundle it and AppRun points the loader at our copy.
      - name: AppImage
        run: |
          a=AppDir
          install -Dm755 -t "$a/usr/bin" target/release/opensynapse target/release/opensynapse-gui
          cp assets/opensynapse.desktop assets/icon.svg "$a/"
          mv "$a/icon.svg" "$a/opensynapse.svg"
          sudo apt-get install -y --no-install-recommends libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1
          lib=/usr/lib/$(uname -m)-linux-gnu
          install -Dm644 -t "$a/usr/lib" "$lib/libxkbcommon.so.0" "$lib/libxkbcommon-x11.so.0" "$lib/libxcb-xkb.so.1"
          printf '%s\n' '#!/bin/sh' \
            'here="$(dirname "$(readlink -f "$0")")"' \
            'export LD_LIBRARY_PATH="$here/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$here/usr/bin/opensynapse-gui" "$@"' > "$a/AppRun"
          chmod +x "$a/AppRun"
          curl -sSfLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage
          echo "${{ matrix.appimagetool }}  appimagetool" | sha256sum -c
          chmod +x appimagetool
          ARCH=${{ matrix.arch }} APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$a" "OpenSynapse-${TAG#v}-${{ matrix.arch }}.AppImage"

      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # both architectures race to create the release, the loser just uploads
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes || true
          gh release upload "$TAG" --clobber opensynapse-*.tar.gz opensynapse_*.deb OpenSynapse-*.AppImage

  aur:
    needs: build
    # also runs when build was skipped with publish_only
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      # one package failing (say, nothing changed on a re-run) shouldn't cancel the others
      fail-fast: false
      matrix:
        include:
          - pkg: opensynapse
            sums: true
          - pkg: opensynapse-bin
            sums: true
          # builds from git, so there is nothing to checksum
          - pkg: opensynapse-git
            sums: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/" contrib/aur/${{ matrix.pkg }}/PKGBUILD

      # Job-level `if:` can't read the secrets context, so check for AUR_KEY
      # here and skip the deploy step until the secret exists.
      - id: check-secret
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      # Regenerates sha256sums (updpkgsums) and .SRCINFO in its own container.
      - if: steps.check-secret.outputs.has_key == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: ./contrib/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: ${{ matrix.sums }}
          commit_username: Lucas Santos
          commit_email: hello@lsantos.dev
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "Update to ${{ env.TAG }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

  # Adds the release's .debs to the apt-repo branch, which pages.yml serves under /apt.
  # Signed when the GPG_PRIVATE_KEY secret exists, unsigned ([trusted=yes]) until then.
  apt:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: update the apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # apt-ftparchive writes the Release file with every checksum apt wants
          sudo apt-get install -y -qq apt-utils >/dev/null
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" apt-repo >/dev/null; then
            git clone -q --single-branch --branch apt-repo "$remote" apt
          else
            git init -q -b apt-repo apt
            git -C apt remote add origin "$remote"
          fi
          cd apt
          mkdir -p pool/main
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.deb' -D pool/main --clobber
          for arch in amd64 arm64; do
            dir="dists/stable/main/binary-$arch"
            mkdir -p "$dir"
            dpkg-scanpackages --arch "$arch" pool > "$dir/Packages"
            gzip -kf "$dir/Packages"
          done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=opensynapse \
            -o APT::FTPArchive::Release::Label=opensynapse \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > Release.tmp
          mv Release.tmp dists/stable/Release
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
            gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
            gpg --batch --yes --armor --export > public.key
          fi
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -qm "apt: $TAG"
          git push -q origin apt-repo
          # pushes made with the workflow token don't start other workflows, a dispatch does
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY"

  # Points the formula in khaosdoctor/homebrew-tap at this release's tarballs.
  # Skipped until the HOMEBREW_TAP_TOKEN secret exists.
  homebrew:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: update the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "no HOMEBREW_TAP_TOKEN secret, skipping"
            exit 0
          fi
          v="${TAG#v}"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "opensynapse-$v-*.tar.gz"
          x86=$(sha256sum "opensynapse-$v-x86_64.tar.gz" | cut -d' ' -f1)
          arm=$(sha256sum "opensynapse-$v-aarch64.tar.gz" | cut -d' ' -f1)
          # 1,2d drops the template's header comment, it only makes sense in this repo
          sed -e '1,2d' -e "s/@VERSION@/$v/g" -e "s/@SHA_X86_64@/$x86/" -e "s/@SHA_AARCH64@/$arm/" \
            contrib/homebrew/opensynapse.rb > opensynapse.rb
          file=repos/khaosdoctor/homebrew-tap/contents/Formula/opensynapse.rb
          sha=$(GH_TOKEN="$TAP_TOKEN" gh api "$file" -q .sha 2>/dev/null || true)
          GH_TOKEN="$TAP_TOKEN" gh api -X PUT "$file" -f message="opensynapse $v" \
            -f content="$(base64 -w0 opensynapse.rb)" ${sha:+-f sha="$sha"}
