<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opensynapse</title>
<meta name="description" content="Remap buttons, set DPI and lighting on Razer mice from Linux.">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  /* colours from the OpenSynapse dark theme in src/bin/opensynapse-gui/palettes.rs */
  :root {
    --bg: #07070d;
    --panel: #0e0e1a;
    --cyan: #00f0ff;
    --pink: #ff2a6d;
    --yellow: #fcee0a;
    --dim: #5a5a7a;
    --text: #c8c8dc;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 var(--mono);
    background-image: linear-gradient(rgba(0, 240, 255, .03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0, 240, 255, .03) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  main { max-width: 860px; margin: 0 auto; padding: 48px 16px 64px; }
  a { color: var(--cyan); text-underline-offset: 3px; }
  a:hover { color: var(--pink); }
  h1, h2, h3 { font-weight: 700; letter-spacing: .04em; margin: 0; }
  h2 {
    color: var(--pink);
    font-size: 1.05rem;
    text-transform: uppercase;
    margin: 56px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--dim);
  }
  h2::before { content: "// "; color: var(--dim); }
  h3 { color: var(--cyan); font-size: 1rem; margin: 28px 0 12px; }
  p { margin: 0 0 14px; }
  strong { color: #fff; }
  em strong, strong em { color: var(--pink); }
  code {
    color: var(--yellow);
    background: var(--panel);
    padding: 1px 5px;
    border-radius: 3px;
    overflow-wrap: anywhere;
  }
  pre {
    background: var(--panel);
    border: 1px solid var(--dim);
    border-left: 3px solid var(--cyan);
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0 0 16px;
    font-size: .88rem;
    line-height: 1.55;
  }
  pre code { background: none; padding: 0; color: var(--text); overflow-wrap: normal; }
  ul, ol { padding-left: 20px; margin: 0 0 14px; }
  li { margin-bottom: 8px; }
  ul li::marker { color: var(--pink); content: "> "; }
  img { max-width: 100%; height: auto; }
  p > img { display: block; background: var(--panel); border: 1px solid var(--dim); padding: 8px; margin-bottom: 8px; }

  header { text-align: center; margin-bottom: 40px; }
  header img { width: 128px; height: 128px; }
  header h1 {
    color: var(--pink);
    font-size: clamp(2rem, 8vw, 3.2rem);
    margin-top: 12px;
    text-shadow: 0 0 18px rgba(255, 42, 109, .55);
  }
  .tagline { color: var(--cyan); margin: 8px 0 24px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid var(--pink);
    color: var(--pink);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: .85rem;
  }
  .btn:hover { background: var(--pink); color: var(--bg); }
  .btn.alt { border-color: var(--cyan); color: var(--cyan); }
  .btn.alt:hover { background: var(--cyan); color: var(--bg); }

  /* GitHub alerts become boxes, plain quotes (the disclaimer) are dimmed */
  .box, blockquote {
    background: var(--panel);
    border: 1px solid var(--dim);
    padding: 14px 16px;
    margin: 0 0 16px;
  }
  blockquote { color: var(--dim); font-size: .88rem; }
  .box.warning, .box.caution { border-color: var(--yellow); }
  .box.warning strong, .box.caution strong { color: var(--yellow); }
  .box.note, .box.tip, .box.important { border-color: var(--cyan); }
  .box > :last-child, blockquote > :last-child { margin-bottom: 0; }

  footer {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    color: var(--dim);
    font-size: .8rem;
    border-top: 1px solid var(--panel);
  }

  @media (max-width: 480px) {
    body { font-size: 14px; }
    main { padding-top: 32px; }
    header img { width: 96px; height: 96px; }
    pre { font-size: .8rem; padding: 12px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.svg" alt="opensynapse icon">
    <h1>opensynapse</h1>
    <p class="tagline">Remap buttons, set DPI and lighting on Razer mice from Linux.</p>
    <div class="links">
      <a class="btn" href="https://github.com/khaosdoctor/opensynapse">GitHub</a>
      <a class="btn alt" href="#install">Install</a>
      <a class="btn alt" href="#adding-your-mouse">Add your mouse</a>
    </div>
  </header>

  <!-- filled from README.md on main, so the site never drifts from it -->
  <article id="readme">
    <noscript><p>This page shows the README, <a href="https://github.com/khaosdoctor/opensynapse#readme">read it on GitHub</a>.</p></noscript>
  </article>
</main>
<footer>
  <p>opensynapse is open source, <a href="https://github.com/khaosdoctor/opensynapse">khaosdoctor/opensynapse</a> on GitHub. Not affiliated with, endorsed by, or supported by Razer Inc.</p>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  const REPO = "khaosdoctor/opensynapse";
  const RAW = `https://raw.githubusercontent.com/${REPO}/main/`;
  const BLOB = `https://github.com/${REPO}/blob/main/`;
  const out = document.getElementById("readme");

  fetch(RAW + "README.md")
    .then((r) => (r.ok ? r.text() : Promise.reject(r.status)))
    .then((md) => {
      // the header above already has the icon, name and tagline
      md = md.slice(md.indexOf("\n> [!") + 1);
      // GitHub alerts (> [!WARNING]) -> <div class="box warning">
      md = md.replace(/^> \[!(\w+)\]\n((?:>.*\n?)*)/gm, (_, kind, body) =>
        `<div class="box ${kind.toLowerCase()}">\n\n${body.replace(/^> ?/gm, "")}\n</div>\n`);
      out.innerHTML = DOMPurify.sanitize(marked.parse(md));

      // same anchors as GitHub, so README links like #install work here
      for (const h of out.querySelectorAll("h2, h3")) {
        h.id = h.textContent.trim().toLowerCase().replace(/[^\w\- ]/g, "").replace(/ /g, "-");
      }
      // README paths are relative to the repo root, this page lives in docs/
      for (const a of out.querySelectorAll("a[href]")) {
        const href = a.getAttribute("href");
        if (!/^(https?:|#|mailto:)/.test(href)) a.href = BLOB + href;
      }
      for (const img of out.querySelectorAll("img[src]")) {
        const src = img.getAttribute("src");
        if (!/^https?:/.test(src)) img.src = src.startsWith("docs/") ? src.slice(5) : RAW + src;
      }
      if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    })
    .catch(() => {
      out.innerHTML = `<p>Couldn't load the README, <a href="https://github.com/${REPO}#readme">read it on GitHub</a>.</p>`;
    });
</script>
</body>
</html>
