name: add-device

# An issue titled "New Device: ..." (what `opensynapse protocol send` opens) gets
# the add-device label and a PR that adds the mouse, labeled new-device so it
# ships a release once merged. Adding add-device by hand starts it too. Anyone can
# open such an issue, so the body is only parsed as data, and the PR still needs
# your review to merge.
on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read

jobs:
  pr:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'add-device') ||
      (github.event.action != 'labeled' && startsWith(github.event.issue.title, 'New Device:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # a label added with this token doesn't start another run, so this is only for you to see
      - name: label the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --add-label add-device

      # the issue body is untrusted, it only goes through device-from-issue as data,
      # which checks the device file with the app's own parser before writing it
      - id: files
        run: cargo run --locked --release --example device-from-issue -- "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

      - name: check the device file parses
        run: cargo test --locked

      - name: open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.files.outputs.slug }}
          NAME: ${{ steps.files.outputs.name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          branch="device/$SLUG"
          git switch -c "$branch"
          git add "devices/$SLUG.jsonc" "devices/protocols/$SLUG.md"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -qm "feat(devices): add $NAME"
          git push -f origin "$branch"
          url=$(gh pr create --head "$branch" --title "feat(devices): add $NAME" \
            --body "Adds $NAME from #$ISSUE. Closes #$ISSUE" 2>/dev/null \
            || gh pr view "$branch" --json url -q .url)
          # new-device makes device-release.yml ship a patch release once it's merged. We add it
          # here, also when the PR already existed, because PRs opened with this workflow's token
          # don't start label-device.yml
          gh pr edit "$url" --add-label new-device
          # Copilot review is a nice-to-have, it fails when Copilot isn't available for the repo
          gh pr edit "$url" --add-reviewer @copilot || echo "couldn't request a Copilot review"
          gh issue comment "$ISSUE" --body "Thanks! Opened $url to add it, it goes in the next release once it's merged."
